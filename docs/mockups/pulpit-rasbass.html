#rasbass-dashboard-preview .rb-brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-size:20px;font-weight:800;letter-spacing:1px;}
#rasbass-dashboard-preview .rb-brand img{filter:invert(1);mix-blend-mode:screen;object-fit:contain;}
#rasbass-dashboard-preview .rb-demo{font-size:13px;opacity:.85;}
#rasbass-dashboard-preview .rb-account{display:grid;place-items:center;width:44px;height:44px;border-radius:8px;}
#rasbass-dashboard-preview .rb-account:hover{background:#ffffff18;}
#rasbass-dashboard-preview .rb-account svg{width:30px;height:30px;stroke-width:1.5;}
#rasbass-dashboard-preview .rb-sidebar{padding:12px;border-right:1px solid var(--rb-border);background:var(--rb-surface);}
#rasbass-dashboard-preview .rb-nav{display:flex;align-items:center;gap:13px;width:100%;padding:14px 12px;border-radius:4px;min-height:50px;}
#rasbass-dashboard-preview .rb-current{color:var(--rb-blue);background:var(--rb-blue-soft);}
#rasbass-dashboard-preview .rb-nav.rb-current:hover{background:var(--rb-blue-soft);}
#rasbass-dashboard-preview .rb-count{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:16px;font-size:13px;font-weight:700;}
#rasbass-dashboard-preview .rb-yellow{background:var(--rb-yellow-bg);color:var(--rb-yellow-text);}
#rasbass-dashboard-preview .rb-main{min-width:0;padding:28px 24px 36px;}
#rasbass-dashboard-preview .rb-column{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px;}
#rasbass-dashboard-preview .rb-page-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
#rasbass-dashboard-preview h1{font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.7px;}
#rasbass-dashboard-preview h2{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.3px;}
#rasbass-dashboard-preview .rb-date{font-size:16px;margin-top:6px;}
#rasbass-dashboard-preview .rb-muted{color:var(--rb-muted);}
#rasbass-dashboard-preview .rb-warning{color:var(--rb-red);}
#rasbass-dashboard-preview .rb-amber{color:var(--rb-amber);}
#rasbass-dashboard-preview .rb-period select{background:var(--rb-surface);border:1px solid var(--rb-border);border-radius:8px;padding:9px 28px 9px 12px;min-height:42px;font-size:15px;max-width:100%;}
#rasbass-dashboard-preview .rb-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
#rasbass-dashboard-preview .rb-metric{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--rb-border);border-radius:12px;padding:16px 18px;gap:4px;background:var(--rb-surface);min-width:0;}
#rasbass-dashboard-preview .rb-metric-label{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font-size:16px;color:var(--rb-muted);}
#rasbass-dashboard-preview .rb-metric-label svg{width:18px;height:18px;opacity:.75;}
#rasbass-dashboard-preview .rb-metric>strong{font-size:30px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-.6px;}
#rasbass-dashboard-preview .rb-metric-note{font-size:14px;}
#rasbass-dashboard-preview .rb-section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
#rasbass-dashboard-preview .rb-section-heading>span{font-size:16px;}
#rasbass-dashboard-preview .rb-orders>li+li{border-top:1px solid var(--rb-border);}
#rasbass-dashboard-preview .rb-order{display:flex;gap:16px;align-items:flex-start;width:100%;padding:20px 0;border-radius:4px;}
#rasbass-dashboard-preview .rb-cover{width:91px;height:91px;flex:0 0 91px;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:light-dark(#dedbd0,#45483d);}
#rasbass-dashboard-preview .rb-cover-red{--rb-label:#8e3d32;}
#rasbass-dashboard-preview .rb-cover-green{--rb-label:#536946;}
#rasbass-dashboard-preview .rb-cover-yellow{--rb-label:#b3973d;}
#rasbass-dashboard-preview .rb-vinyl{display:grid;place-items:center;width:82px;height:82px;border-radius:50%;background:repeating-radial-gradient(circle at center,#292a26 0 2px,#1a1b19 2px 3px,#292a26 3px 4px);box-shadow:2px 3px 4px #0002;}
#rasbass-dashboard-preview .rb-vinyl>span{display:grid;place-items:center;text-align:center;width:39px;height:39px;border-radius:50%;background:var(--rb-label);color:#fff4cd;font-size:7px;font-weight:700;letter-spacing:.4px;line-height:1.25;border:2px solid #ffffff38;}
#rasbass-dashboard-preview .rb-order-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:5px;}
#rasbass-dashboard-preview .rb-order-copy>strong{font-size:18px;line-height:1.25;}
#rasbass-dashboard-preview .rb-order-subtitle{font-size:16px;color:var(--rb-muted);line-height:1.35;}
#rasbass-dashboard-preview .rb-wait{font-size:18px;font-weight:700;}
#rasbass-dashboard-preview .rb-order-aside{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-end;gap:7px;}
#rasbass-dashboard-preview .rb-order-aside strong{font-size:22px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
#rasbass-dashboard-preview .rb-order-aside svg{width:26px;height:26px;color:var(--rb-muted);}
#rasbass-dashboard-preview .rb-text-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 2px;min-height:42px;color:var(--rb-blue);font-size:16px;font-weight:600;border-radius:6px;}
#rasbass-dashboard-preview .rb-show-orders{display:flex;margin:0 auto;}
#rasbass-dashboard-preview .rb-attention{border-top:1px solid var(--rb-border);padding-top:24px;}
#rasbass-dashboard-preview .rb-attention-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-radius:4px;}
#rasbass-dashboard-preview .rb-attention-row+button{border-top:1px solid var(--rb-border);}
#rasbass-dashboard-preview .rb-attention-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex-shrink:0;background:var(--rb-yellow-bg);color:var(--rb-yellow-text);}
#rasbass-dashboard-preview .rb-attention-icon.rb-ready{background:var(--rb-green-bg);color:var(--rb-green);}
#rasbass-dashboard-preview .rb-attention-row>span:nth-child(2){display:flex;flex:1;min-width:0;flex-direction:column;gap:3px;}
#rasbass-dashboard-preview .rb-attention-row strong{font-size:17px;font-weight:600;}
#rasbass-dashboard-preview .rb-attention-row .rb-muted{font-size:15px;}
#rasbass-dashboard-preview .rb-attention-row>svg{color:var(--rb-muted);}
#rasbass-dashboard-preview .rb-sales{border-top:1px solid var(--rb-border);padding-top:24px;}
#rasbass-dashboard-preview .rb-chart-summary{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:12px 0 16px;}
#rasbass-dashboard-preview .rb-chart-summary strong{font-size:26px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
#rasbass-dashboard-preview .rb-chart-summary span{font-size:15px;}
#rasbass-dashboard-preview .rb-chart{display:flex;gap:12px;height:152px;}
#rasbass-dashboard-preview .rb-axis{display:flex;flex-direction:column;justify-content:space-between;color:var(--rb-muted);font-size:12px;padding-bottom:26px;flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;}
#rasbass-dashboard-preview .rb-bars{display:grid;flex:1;min-width:0;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:18px;position:relative;}
#rasbass-dashboard-preview .rb-bars:before{content:"";position:absolute;inset:0 0 26px;background:repeating-linear-gradient(to top,transparent 0 calc(50% - 1px),var(--rb-border) calc(50% - 1px) 50%);pointer-events:none;opacity:.65;}
#rasbass-dashboard-preview .rb-bar-column{display:flex;min-width:0;align-items:center;flex-direction:column;justify-content:flex-end;gap:8px;position:relative;}
#rasbass-dashboard-preview .rb-bar{width:60%;max-width:60px;border:0!important;background:var(--rb-blue-solid);border-radius:4px 4px 0 0;min-height:3px;padding:0;position:relative;transition:height .25s ease;}
#rasbass-dashboard-preview .rb-bar:hover,#rasbass-dashboard-preview .rb-bar[aria-pressed="true"]{background:var(--rb-blue);}
#rasbass-dashboard-preview .rb-bar-label{height:18px;color:var(--rb-muted);font-size:12px;white-space:nowrap;}
#rasbass-dashboard-preview .rb-chart-detail{min-height:20px;font-size:13px;color:var(--rb-muted);margin-top:8px;text-align:right;font-variant-numeric:tabular-nums;}
#rasbass-dashboard-preview .rb-stock{border-top:1px solid var(--rb-border);padding-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:15px;}
#rasbass-dashboard-preview .rb-stock>span:first-child{display:flex;align-items:center;gap:6px;}
#rasbass-dashboard-preview .rb-stock>.rb-text-button{margin-left:auto;}
#rasbass-dashboard-preview .rb-stock svg{width:18px;height:18px;}
#rasbass-dashboard-preview .rb-bottom-nav{display:none;}
#rasbass-dashboard-preview .rb-overlay{position:absolute;inset:56px 0 0;z-index:5;background:#0007;padding:50px 24px;align-items:flex-start;justify-content:center;}
#rasbass-dashboard-preview .rb-overlay:not([hidden]){display:flex;}
#rasbass-dashboard-preview .rb-dialog{position:sticky;top:24px;background:var(--rb-surface);color:var(--rb-text);width:100%;max-width:460px;border-radius:14px;padding:24px;box-shadow:0 12px 50px #0003;}
#rasbass-dashboard-preview .rb-dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
#rasbass-dashboard-preview .rb-dialog h2{font-size:24px;}
#rasbass-dashboard-preview .rb-icon-button{padding:8px;display:grid;place-items:center;border-radius:6px;min-width:40px;min-height:40px;}
#rasbass-dashboard-preview .rb-dialog-content{font-size:16px;line-height:1.5;margin-bottom:24px;}
#rasbass-dashboard-preview .rb-dialog-content dl{display:grid;grid-template-columns:1fr auto;gap:10px;margin:20px 0;}
#rasbass-dashboard-preview .rb-dialog-content dd{margin:0;font-weight:600;text-align:right;}
#rasbass-dashboard-preview .rb-dialog-content dt{color:var(--rb-muted);}
#rasbass-dashboard-preview .rb-dialog-list{display:flex;flex-direction:column;gap:0;}
#rasbass-dashboard-preview .rb-dialog-list li{padding:12px 0;border-bottom:1px solid var(--rb-border);}
#rasbass-dashboard-preview .rb-dialog-list li span{display:block;color:var(--rb-muted);font-size:14px;margin-top:3px;}
#rasbass-dashboard-preview .rb-primary-button{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:8px;background:var(--rb-blue-solid);color:#fff;font-size:16px;font-weight:600;}
#rasbass-dashboard-preview .rb-primary-button:hover{background:#1c7ed6;}
#rasbass-dashboard-preview .rb-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
#rasbass-dashboard-preview [hidden]{display:none!important;}
@container (max-width:767px){
  #rasbass-dashboard-preview .rb-app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px auto 72px;}
  #rasbass-dashboard-preview .rb-sidebar{display:none;}
  #rasbass-dashboard-preview .rb-header{background-size:640px 640px;gap:10px;}
  #rasbass-dashboard-preview .rb-demo{font-size:11px;}
  #rasbass-dashboard-preview .rb-main{padding:24px 16px 32px;}
  #rasbass-dashboard-preview .rb-column{gap:26px;}
  #rasbass-dashboard-preview .rb-page-heading{gap:16px;}
  #rasbass-dashboard-preview .rb-period{width:100%;}
  #rasbass-dashboard-preview .rb-period select{width:100%;font-size:16px;}
  #rasbass-dashboard-preview .rb-metric{padding:14px;gap:5px;}
  #rasbass-dashboard-preview .rb-metric-label{font-size:14px;align-items:flex-start;}
  #rasbass-dashboard-preview .rb-metric-label svg{width:16px;height:16px;}
  #rasbass-dashboard-preview .rb-metric>strong{font-size:28px;}
  #rasbass-dashboard-preview .rb-metric-note{font-size:12px;}
  #rasbass-dashboard-preview .rb-section-heading>span{font-size:14px;}
  #rasbass-dashboard-preview .rb-order{gap:12px;flex-wrap:wrap;}
  #rasbass-dashboard-preview .rb-cover{width:72px;height:72px;flex-basis:72px;}
  #rasbass-dashboard-preview .rb-vinyl{width:65px;height:65px;}
  #rasbass-dashboard-preview .rb-vinyl>span{width:31px;height:31px;font-size:6px;}
  #rasbass-dashboard-preview .rb-order-copy{flex-basis:calc(100% - 84px);}
  #rasbass-dashboard-preview .rb-order-aside{margin-left:84px;width:calc(100% - 84px);flex-direction:row;justify-content:space-between;align-items:center;margin-top:-5px;}
  #rasbass-dashboard-preview .rb-order-aside strong{font-size:20px;}
  #rasbass-dashboard-preview .rb-attention-row strong{font-size:16px;}
  #rasbass-dashboard-preview .rb-attention-row .rb-muted{font-size:14px;}
  #rasbass-dashboard-preview .rb-attention-icon{width:36px;height:36px;}
  #rasbass-dashboard-preview .rb-bars{gap:10px;}
  #rasbass-dashboard-preview .rb-bar{width:72%;}
  #rasbass-dashboard-preview .rb-bar-label{font-size:11px;}
  #rasbass-dashboard-preview .rb-stock{gap:10px;font-size:14px;}
  #rasbass-dashboard-preview .rb-stock>.rb-text-button{margin-left:0;}
  #rasbass-dashboard-preview .rb-bottom-nav{grid-column:1;display:flex;justify-content:space-around;align-items:center;gap:3px;height:72px;padding:0 5px;background:var(--rb-surface);border-top:1px solid var(--rb-border);}
  #rasbass-dashboard-preview .rb-bottom-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;flex:1;min-width:0;color:var(--rb-muted);font-size:12px;padding:4px 0;border-radius:5px;}
  #rasbass-dashboard-preview .rb-bottom-item svg{width:26px;height:26px;}
  #rasbass-dashboard-preview .rb-bottom-item.rb-current{background:none;color:var(--rb-blue);font-weight:700;}
  #rasbass-dashboard-preview .rb-camera{display:grid;place-items:center;width:56px;height:56px;flex:0 0 56px;margin-top:-24px;background:var(--rb-blue-solid);color:#fff;border-radius:50%;}
  #rasbass-dashboard-preview .rb-camera:hover{background:#1c7ed6;}
  #rasbass-dashboard-preview .rb-camera svg{width:28px;height:28px;}
  #rasbass-dashboard-preview .rb-overlay{padding:24px 12px;}
  #rasbass-dashboard-preview .rb-dialog{padding:20px;}
}
@container (max-width:355px){
  #rasbass-dashboard-preview .rb-metric-label svg{display:none;}
  #rasbass-dashboard-preview .rb-demo{max-width:70px;text-align:right;line-height:1.15;}
  #rasbass-dashboard-preview .rb-metric{padding:12px 10px;}
  #rasbass-dashboard-preview .rb-section-heading{align-items:flex-start;}
  #rasbass-dashboard-preview .rb-section-heading>span{width:100%;}
}
@media (prefers-reduced-motion:reduce){#rasbass-dashboard-preview .rb-bar{transition:none;}}
</style>
<script>
(()=>{
  const root=document.getElementById('rasbass-dashboard-preview');
  const stage=root.querySelector('.rb-stage');
  const period=root.querySelector('select');
  const overlay=root.querySelector('.rb-overlay');
  const dialogTitle=root.querySelector('#rb-dialog-title');
  const dialogContent=root.querySelector('.rb-dialog-content');
  const bars=root.querySelector('.rb-bars');
  const chart=root.querySelector('.rb-chart');
  const detail=root.querySelector('.rb-chart-detail');
  const config={view:'Komputer',showChart:true};
  let lastFocus=null;
  let selectedBar=-1;
  const periods={
    '30':{total:1480,orders:26,units:41,max:500,labels:['11–17 paź','18–24 paź','25–31 paź','1–9 lis'],values:[280,360,395,445]},
    '7':{total:445,orders:8,units:12,max:120,labels:['Wt','Śr','Cz','Pt','So','Nd','Pn'],values:[35,62,0,88,54,96,110]}
  };
  const formatEur=n=>new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(n)+' €';
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{makieta:'Pulpit RasBass',okresDni:Number(period.value)},privateContent:{view:config.view,showChart:config.showChart}}).catch(()=>{});}
  function applyConfig(){stage.style.maxWidth=config.view==='Telefon'?'420px':'100%';root.querySelector('.rb-sales').hidden=!config.showChart;}
  function renderChart(){
    const data=periods[period.value];
    root.querySelectorAll('[data-sales-total]').forEach(el=>el.textContent=formatEur(data.total));
    root.querySelector('[data-order-count]').textContent=data.orders+' zamówień · '+period.value+' dni';
    root.querySelector('[data-units]').textContent=data.units;
    root.querySelector('[data-sales-period]').textContent='W ostatnich '+period.value+' dniach';
    root.querySelector('[data-chart-period]').textContent='Ostatnie '+period.value+' dni';
    root.querySelector('[data-axis-max]').textContent=formatEur(data.max);
    root.querySelector('[data-axis-mid]').textContent=formatEur(data.max/2);
    bars.replaceChildren();
    data.values.forEach((value,index)=>{
      const column=document.createElement('div');column.className='rb-bar-column';
      const button=document.createElement('button');button.type='button';button.className='rb-bar cursor-interaction';
      button.style.height=Math.max(3,value/data.max*126)+'px';button.dataset.bar=String(index);
      button.setAttribute('aria-label',data.labels[index]+': '+formatEur(value));button.setAttribute('aria-pressed','false');
      button.setAttribute('data-tooltip',data.labels[index]+' · '+formatEur(value));
      const label=document.createElement('span');label.className='rb-bar-label';label.textContent=data.labels[index];
      column.append(button,label);bars.append(column);
    });
    chart.setAttribute('aria-label','Wartość opłaconych produktów: '+data.values.map((v,i)=>data.labels[i]+' '+formatEur(v)).join(', ')+'. Razem '+formatEur(data.total)+'.');
    detail.textContent='Łącznie '+data.units+' sztuk w '+data.orders+' zamówieniach';selectedBar=-1;
  }
  function showDialog(title,html){
    lastFocus=document.activeElement;dialogTitle.textContent=title;dialogContent.innerHTML=html;overlay.hidden=false;
    const close=overlay.querySelector('[data-close]');close.focus({preventScroll:true});
  }
  function closeDialog(){overlay.hidden=true;if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
  const orders={
    '1042':{name:'Anna Kowalska',total:48,status:'Czeka na wysyłkę · opłacone 6 listopada',items:[['Burning Spear — Marcus Garvey','LP · płyta VG+ · okładka VG · 30 €'],['Dennis Brown — Money In My Pocket','7″ · płyta VG+ · generic · 18 €']]},
    '1045':{name:'Piotr Nowak',total:32,status:'Czeka na wysyłkę · opłacone 8 listopada',items:[['King Tubby — Dub From The Roots','LP · płyta VG+ · okładka VG+ · 32 €']]},
    '1046':{name:'Marta Wiśniewska',total:25,status:'Czeka na wysyłkę · opłacone dziś',items:[['The Heptones — On Top','LP · płyta VG+ · okładka VG · 25 €']]},
    '1048':{name:'Tomasz Zieliński',total:18,status:'Czeka na wysyłkę · opłacone dziś',items:[['Johnny Clarke — None Shall Escape','12″ · płyta VG+ · generic · 18 €']]}
  };
  const list=(items)=>'<ul class="rb-dialog-list">'+items.map(item=>'<li><strong>'+item[0]+'</strong><span>'+item[1]+'</span></li>').join('')+'</ul>';
  const dialogs={
    drafts:['Szkice do dokończenia',list([['3 gotowe do publikacji','Uzupełnione dane, zdjęcia i ceny'],['3 bez zdjęć','Dodaj zdjęcie labelu lub okładki'],['2 wymagają uzupełnienia','Brakuje ceny albo oceny stanu']])],
    ready:['Gotowe do publikacji',list([['Horace Andy — Skylarking','LP · VG+ / VG · 28 €'],['Augustus Pablo — East Of The River Nile','LP · VG+ / VG+ · 35 €'],['Johnny Osbourne — Truths And Rights','LP · VG+ / VG · 30 €']])],
    pending:['Czeka na płatność',list([['#1040 · Katarzyna Wójcik · 42 €','Złożone 7 listopada · 2 płyty'],['#1047 · Michał Lewandowski · 25 €','Złożone 9 listopada · 1 płyta']])],
    products:['Magazyn',list([['286 sztuk na stanie','214 wydań dostępnych w sklepie'],['8 szkiców','3 gotowe do publikacji']])],
    add:['Dodaj płytę','<p>W tym miejscu otworzy się Twój obecny kreator dodawania płyty.</p><ol><li>Zdjęcie labelu</li><li>Wybór wydania</li><li>Stan i cena</li><li>Zdjęcia i publikacja</li></ol>'],
    settings:['Ustawienia','<p>Obecne ustawienia panelu: połączenia z Discogs i rozpoznawaniem zdjęć oraz preferencje sklepu.</p>'],
    account:['Konto','<p>Panel właściciela RasBass</p><p class="rb-muted">Podgląd z przykładowymi danymi.</p>']
  };
  root.addEventListener('click',event=>{
    const close=event.target.closest('[data-close]');if(close){closeDialog();return;}
    if(event.target===overlay){closeDialog();return;}
    const orderButton=event.target.closest('[data-order]');
    if(orderButton){const order=orders[orderButton.dataset.order];showDialog('Zamówienie #'+orderButton.dataset.order,'<p><strong>'+order.name+'</strong></p><p class="rb-muted">'+order.status+'</p>'+list(order.items)+'<dl><dt>Wartość produktów</dt><dd>'+formatEur(order.total)+'</dd></dl>');return;}
    const bar=event.target.closest('[data-bar]');
    if(bar){selectedBar=Number(bar.dataset.bar);const data=periods[period.value];bars.querySelectorAll('[data-bar]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.bar)===selectedBar)));detail.textContent=data.labels[selectedBar]+' · '+formatEur(data.values[selectedBar]);return;}
    const show=event.target.closest('.rb-show-orders');
    if(show){const expanded=show.getAttribute('aria-expanded')==='true';root.querySelectorAll('.rb-extra-order').forEach(el=>el.hidden=expanded);show.setAttribute('aria-expanded',String(!expanded));show.innerHTML=expanded?'Pokaż wszystkie 4 zamówienia <i data-lucide="arrow-down" aria-hidden="true"></i>':'Pokaż mniej <i data-lucide="arrow-up" aria-hidden="true"></i>';if(globalThis.lucide)lucide.createIcons();return;}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(action==='shipping'){root.querySelector('.rb-shipping').scrollIntoView({behavior:'auto',block:'start'});return;}
    if(action==='sales'){config.showChart=true;applyConfig();root.querySelector('.rb-sales').scrollIntoView({behavior:'auto',block:'start'});return;}
    if(action==='home'){root.scrollIntoView({behavior:'auto',block:'start'});return;}
    if(action&&dialogs[action])showDialog(dialogs[action][0],dialogs[action][1]);
  });
  root.addEventListener('keydown',event=>{
    if(overlay.hidden)return;
    if(event.key==='Escape'){closeDialog();return;}
    if(event.key==='Tab'){const controls=overlay.querySelectorAll('button');const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  period.addEventListener('change',()=>{renderChart();save();});
  function applySaved(state){if(state?.modelContent?.okresDni&&periods[String(state.modelContent.okresDni)])period.value=String(state.modelContent.okresDni);if(['Komputer','Telefon'].includes(state?.privateContent?.view))config.view=state.privateContent.view;if(typeof state?.privateContent?.showChart==='boolean')config.showChart=state.privateContent.showChart;applyConfig();renderChart();}
  applySaved(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)applySaved(event.detail.globals.widgetState);});
  if(globalThis.Tweak){const tweak=new Tweak({container:stage,onChange:()=>{applyConfig();save();}});tweak.addSelect(config,'view',{label:'Widok',options:['Komputer','Telefon']});tweak.addToggle(config,'showChart',{label:'Wykres sprzedaży'});}
})();
</script>
